<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — VapeZone</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- ========== ЭКРАН АВТОРИЗАЦИИ ========== -->
    <div id="authSection" class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">🔐 VapeZone <span>Admin</span></div>
            <p class="auth-subtitle">Панель управления каталогом</p>

            <!-- Форма входа -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginName">Имя администратора</label>
                    <input type="text" id="loginName" placeholder="Введите имя" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Войти</button>
            </form>

            <!-- Форма регистрации (скрыта по умолчанию) -->
            <form id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="regName">Имя администратора *</label>
                    <input type="text" id="regName" placeholder="Введите имя" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Пароль *</label>
                    <input type="password" id="regPassword" placeholder="Минимум 4 символа" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">E-mail</label>
                    <input type="email" id="regEmail" placeholder="Необязательно">
                </div>
                <div class="form-group">
                    <label for="regDescription">Описание</label>
                    <input type="text" id="regDescription" placeholder="Необязательно">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Зарегистрировать</button>
            </form>

            <button id="toggleFormBtn" class="btn-link">Создать нового администратора</button>
            <div id="authError" class="error-msg"></div>
        </div>
    </div>

    <!-- ========== ПАНЕЛЬ УПРАВЛЕНИЯ ========== -->
    <div id="dashboardSection" style="display: none;">
        <header class="dash-header">
            <div class="dash-header__left">
                <span class="dash-logo">🔐 VapeZone <span>Admin</span></span>
            </div>
            <div class="dash-header__right">
                <span id="adminNameDisplay" class="admin-name"></span>
                <button id="logoutBtn" class="btn btn-outline btn-small">Выйти</button>
            </div>
        </header>

        <main class="dash-content">
            <div class="dash-toolbar">
                <h2>Каталог товаров</h2>
                <button id="addItemBtn" class="btn btn-primary">+ Добавить товар</button>
            </div>

            <div class="table-wrapper">
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Фото</th>
                            <th>Название</th>
                            <th>Цена</th>
                            <th>Остаток</th>
                            <th>Категория</th>
                            <th>Поставщик</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody">
                        <tr><td colspan="8" class="loading-cell">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ========== МОДАЛЬНОЕ ОКНО (добавление / редактирование) ========== -->
    <div id="itemModal" class="modal" style="display: none;">
        <div class="modal__overlay"></div>
        <div class="modal__window">
            <button id="closeModalBtn" class="modal__close">✕</button>
            <h3 id="modalTitle">Добавить товар</h3>

            <form id="itemForm" class="modal-form">
                <input type="hidden" id="itemId">

                <div class="form-group">
                    <label for="itemName">Название *</label>
                    <input type="text" id="itemName" required maxlength="300">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemPrice">Цена (₽) *</label>
                        <input type="number" id="itemPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="itemStock">Остаток (шт.) *</label>
                        <input type="number" id="itemStock" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemCategory">Категория *</label>
                        <select id="itemCategory" required></select>
                    </div>
                    <div class="form-group">
                        <label for="itemSupplier">Поставщик *</label>
                        <select id="itemSupplier" required></select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="itemPhoto">Путь к фото</label>
                    <input type="text" id="itemPhoto" placeholder="/image.png" maxlength="300">
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" id="cancelModalBtn" class="btn btn-outline">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========== TOAST-УВЕДОМЛЕНИЕ ========== -->
    <div id="toast" class="toast"></div>

    <script src="admin.js"></script>
</body>
</html>
